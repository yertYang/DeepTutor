# Use only an image built from this Rust migration; upstream images still use Python.
services:
  deeptutor:
    image: ${DEEPTUTOR_NATIVE_IMAGE:?Set a Rust-native image tag or digest}
    pull_policy: always
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT_FRONTEND:-3782}:3782"
    volumes:
      - ${DEEPTUTOR_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
