[workspace]
members = ["rust/codex", "rust/server", "rust/xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "net", "sync"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
