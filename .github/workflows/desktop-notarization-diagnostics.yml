name: Desktop Notarization Diagnostics

# Read the latest Apple result for each Mac edition without rebuilding or
# publishing. Only this project's submissions are included in the saved reports.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/desktop-notarization-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the latest Lorevia notarization reports
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: node apps/desktop/scripts/notarization-diagnostics.mjs

      - name: Save Apple reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-notarization-reports
          path: ${{ runner.temp }}/notarization-reports/*.json
          retention-days: 7
