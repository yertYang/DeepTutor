name: Native runtime bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/**"
      - "Cargo.*"
      - "VERSION"
      - ".github/workflows/native-bundles.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Build locked native bundle
        run: cargo run --locked --release -p deeptutor-build -- --target ${{ matrix.target }} --output dist/native --archive dist/yanzhizhou-native-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: yanzhizhou-native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
